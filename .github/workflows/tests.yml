name: Package Tests
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the matching FNX Subbase development branch
        uses: actions/checkout@v4
        with:
          repository: fnx-software/subbase
          ref: feat/universal-billing-foundation
          path: _packages/subbase
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, sqlite3, pdo_sqlite, bcmath
          coverage: none
          tools: composer:v2
      - run: composer validate --no-check-publish --strict
      - name: Resolve local cross-fork package under its new Composer identity
        run: |
          composer config repositories.fnx-dev-subbase --json '{"type":"path","url":"_packages/subbase","options":{"symlink":false,"versions":{"fnx-software/subbase":"dev-feat/universal-billing-foundation"}}}'
      - run: composer update --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
      # Original upstream contains pre-existing formatting differences.
      # Check the new stable files first; full-repo formatting follows separately.
      - run: vendor/bin/pint --test src/Support/SubbasePaymentPermission.php src/Support/AuthenticatedBillableResolver.php src/Contracts/ResolvesCheckoutBillable.php src/Services/CheckoutBillableManager.php tests/Checkout/CheckoutBillableManagerTest.php tests/Authorization/SubbasePaymentPermissionTest.php tests/Checkout/AuthenticatedBillableResolverTest.php tests/Gateways/StripeWebhookStatusTest.php src/Support/GatewayMoney.php tests/Money/GatewayMoneyTest.php src/Services/PaidSubscriptionActivator.php src/Services/VerifiedPaymentProcessor.php tests/Checkout/VerifiedPaymentProcessorTest.php tests/Checkout/PaidOrganizationSettlementTest.php src/Support/PaymentTenancy.php src/Contracts/PaymentTenantAccess.php tests/Authorization/PaymentTenancyTest.php tests/Migrations/PaymentSchemaTest.php src/Services/PaidLicenseOrderFulfillment.php src/Events/LicenseOrderFulfilled.php src/Services/LicenseCheckoutService.php src/Http/Controllers/LicenseMarketplaceController.php tests/Licensing/LicensePaymentTest.php
      - run: composer audit --no-dev
